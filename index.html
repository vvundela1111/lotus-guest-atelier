<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lotus Hotels · Guest Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem("lotus_theme");if(!t){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
  :root{
    color-scheme:light;
    /* ATV design-system palette (warm terracotta + clay + cream) */
    --color-background:#faf7f3; --color-surface:#fffdf9; --color-border:#ded5cc; --color-border-subtle:#f0eae4;
    --color-accent:#b76e79; --color-accent-hover:#9c5561; --color-accent-muted:#f3dde3; --color-on-accent:#fff;
    --color-text-primary:#332923; --color-text-secondary:#74645a; --color-text-muted:#9b8d84;
    --color-success:#4f7a52; --color-error:#b04030;
    /* semantic aliases */
    --ink:#332923; --ink-2:#493a31; --ink-soft:#5e4b40;
    --brass:#b76e79; --brass-2:#9c5561; --gold:#d19aa6;
    --aubergine:#7f4d57; --rose:#b85d55;
    --ivory:#fbf6ef; --cream:#faf7f3; --paper:#fffdf9; --card:#fffdf9;
    --line:#ded5cc; --line-2:#f0eae4;
    --muted:#74645a; --text:#332923; --heading:#2a211c; --sub:#5e4b40;
    --chip:rgba(51,41,35,.06); --field:#fffdf9; --scroll:rgba(51,41,35,.2);
    --brass-soft:rgba(183,110,121,.12); --overlay:rgba(51,41,35,.5);
    --warn-bg:rgba(176,64,48,.12); --warn-tx:#a5392b; --warn-ln:rgba(176,64,48,.32);
    --good-bg:rgba(79,122,82,.12); --good-tx:#3f6a42; --good-ln:rgba(79,122,82,.28);
    --header:linear-gradient(175deg,#332923,#493a31);
    --glow1:rgba(183,110,121,.12); --glow2:rgba(51,41,35,.08);
    --shadow:0 1px 2px rgba(63,43,31,.05),0 14px 30px -20px rgba(63,43,31,.4);
    --serif:"Fraunces","Cormorant Garamond",Georgia,"Times New Roman",serif;
    --sans:"DM Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    /* warm espresso dark variant of the ATV palette */
    --ink:#160f0b; --ink-2:#22160f; --ink-soft:#3a2a20;
    --brass:#d98aa0; --brass-2:#e6a0b3; --gold:#edb8c6;
    --aubergine:#9c6070; --rose:#cf7d72;
    --ivory:#f6ede4;
    --cream:#150f0b; --paper:#1e150f; --card:#241a13;
    --line:rgba(246,237,228,.14); --line-2:rgba(246,237,228,.07);
    --muted:#b6a599; --text:#eee3d8; --heading:#f7efe7;
    --sub:#cdb9ab; --chip:rgba(246,237,228,.08); --field:#1d140e; --scroll:rgba(246,237,228,.2);
    --brass-soft:rgba(217,138,160,.16); --overlay:rgba(0,0,0,.6);
    --warn-bg:rgba(200,90,74,.22); --warn-tx:#f0a897; --warn-ln:rgba(200,90,74,.45);
    --good-bg:rgba(120,180,130,.16); --good-tx:#93cf9d; --good-ln:rgba(120,180,130,.34);
    --header:linear-gradient(175deg,#160f0b,#241811);
    --glow1:rgba(183,110,121,.18); --glow2:rgba(0,0,0,.42);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -22px rgba(0,0,0,.78);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans);color:var(--text);background:var(--cream);
    background-image:radial-gradient(1100px 560px at 88% -12%,var(--glow1),transparent 60%),
                     radial-gradient(820px 480px at -12% 112%,var(--glow2),transparent 55%);
    -webkit-font-smoothing:antialiased;transition:background-color .35s ease,color .35s ease;
  }
  .app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-height:0;position:relative;z-index:1}
  /* paper grain — subtle ink-and-paper ground */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/></svg>")}
  [data-theme="dark"] body::before{mix-blend-mode:soft-light;opacity:.6}
  /* editorial ledger heading — replaces shouty uppercase eyebrows */
  .eyebrow{font-family:var(--serif);font-weight:600;font-size:13px;letter-spacing:.2px;color:var(--heading);
    display:flex;align-items:center;gap:10px;margin:2px 2px 14px}
  .eyebrow::before{content:"";width:14px;height:14px;flex:0 0 auto;color:var(--brass);
    background:currentColor;-webkit-mask:var(--lotus-mask) center/contain no-repeat;mask:var(--lotus-mask) center/contain no-repeat}
  .eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  :root{--lotus-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M12 20V8'/><path d='M12 20c-3-1.6-4.5-4.4-5-8 2.4 1 4 3.5 5 8z'/><path d='M12 20c3-1.6 4.5-4.4 5-8-2.4 1-4 3.5-5 8z'/><path d='M12 20c-4-.8-6.5-2.6-8-5.6 3-.3 6 1.3 8 5.6z'/><path d='M12 20c4-.8 6.5-2.6 8-5.6-3-.3-6 1.3-8 5.6z'/></svg>")}

  /* Header */
  header.top{display:flex;align-items:center;gap:18px;padding:13px 24px;
    background:var(--header);color:var(--ivory);
    border-bottom:1px solid rgba(183,110,121,.32)}
  .brand{display:flex;align-items:center;gap:13px}
  .lotus{color:var(--brass);width:36px;height:36px;flex:0 0 auto}
  .brand h1{font-family:var(--serif);font-weight:600;font-size:25px;letter-spacing:.2px;margin:0;line-height:1}
  .brand .sub{font-family:var(--serif);font-style:italic;font-weight:400;font-size:13px;letter-spacing:.2px;color:rgba(251,244,230,.7);margin-top:3px}
  .metrics{margin-left:auto;display:flex;gap:24px;align-items:center}
  .metric{text-align:right;position:relative}
  .metric+.metric{padding-left:24px;border-left:1px solid rgba(183,110,121,.25)}
  .metric .v{font-family:var(--serif);font-size:21px;color:#fff;line-height:1;font-weight:600}
  .metric .v .a{color:var(--brass);font-size:13px}
  .metric .l{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:rgba(251,246,239,.72);margin-top:5px}

  .main{display:grid;grid-template-columns:290px 1fr 360px;min-height:0;overflow:hidden}
  .rail{overflow-y:auto;padding:20px 16px;background:rgba(255,253,247,.5)}
  [data-theme="dark"] .rail{background:#1b130d}
  .rail.left{border-right:1px solid var(--line)}
  .rail.right{border-left:1px solid var(--line)}
  .overline{font-family:var(--serif);font-weight:600;font-size:13px;letter-spacing:.2px;color:var(--heading);margin:2px 4px 14px;
    display:flex;align-items:center;gap:10px}
  .overline::before{content:"";width:13px;height:13px;flex:0 0 auto;background:var(--brass);
    -webkit-mask:var(--lotus-mask) center/contain no-repeat;mask:var(--lotus-mask) center/contain no-repeat}
  .overline::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  /* Roster — editorial specimen rows (de-boxed) */
  .gcard{width:100%;text-align:left;background:transparent;border:none;border-radius:10px;
    padding:12px 12px 12px 11px;margin-bottom:1px;cursor:pointer;display:flex;gap:12px;align-items:center;
    transition:background .15s ease;position:relative}
  .gcard::after{content:"";position:absolute;left:11px;right:8px;bottom:0;height:1px;background:var(--line-2)}
  .gcard:hover{background:var(--brass-soft)}
  .gcard.active{background:var(--brass-soft)}
  .gcard.active::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;background:var(--brass)}
  .avatar{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:16px;font-weight:600;color:#fff;letter-spacing:.3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .gcard .nm{font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.1;color:var(--heading)}
  .gcard .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .tier{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.4px;
    font-weight:600;margin-top:8px;padding:2px 9px;border-radius:999px}
  .tier .dot{width:6px;height:6px;border-radius:50%}
  .tier.lotus{background:rgba(183,110,121,.15);color:var(--brass-2)}
  .tier.blossom{background:rgba(111,70,57,.14);color:#8a5346}
  .tier.petal{background:var(--chip);color:var(--sub)}
  .gcard.walkin{opacity:.9}
  .gcard.walkin::after{background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px)}
  .gcard.walkin .avatar{background:var(--ink) !important;font-size:20px}

  .scn{font-size:12.5px;color:var(--muted);line-height:1.5;padding:7px 9px;border-radius:8px;cursor:pointer}
  .scn:hover{background:rgba(183,110,121,.08);color:var(--heading)}
  .scn b{color:var(--brass-2);font-weight:700}

  /* Console */
  .console{display:flex;flex-direction:column;min-height:0;background:var(--paper);position:relative}
  .stream{flex:1;overflow-y:auto;padding:26px 34px 8px}

  /* Curtain / editorial hero */
  .curtain{max-width:560px;margin:34px auto;text-align:center}
  .curtain .eyeb{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--brass-2);margin-bottom:8px}
  .curtain .big{font-family:var(--serif);font-size:96px;font-weight:600;color:var(--heading);line-height:.92;letter-spacing:-1.5px;position:relative;display:inline-block}
  .curtain .big small{font-size:34px;color:var(--brass);vertical-align:super;font-weight:500}
  .curtain .uline{display:block;width:220px;height:14px;margin:2px auto 0}
  .curtain .uline path{stroke:var(--brass);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320;animation:draw 1.1s .3s cubic-bezier(.6,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .curtain .lead{font-family:var(--serif);font-size:20px;font-weight:500;color:var(--heading);line-height:1.4;margin:20px auto 10px;max-width:460px}
  .curtain .lead b{color:var(--brass-2);font-weight:600}
  .curtain .subl{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0 auto 26px;max-width:420px}
  .cta{background:var(--ink);color:var(--ivory);border:none;border-radius:12px;padding:14px 26px;font-size:14px;font-weight:600;
    font-family:var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
  .cta:hover{background:var(--ink-2)}
  .cta .pl{color:var(--brass);font-size:17px;display:flex}

  .msg{display:flex;gap:12px;margin:18px 0;max-width:780px}
  .msg .who{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#fff}
  .msg.user{justify-content:flex-end;margin-left:auto}
  .msg.user .bubble{background:var(--ink);color:var(--ivory);border-radius:14px 14px 4px 14px;max-width:520px}
  .msg.user .who{background:var(--ink-2);order:2}
  .bubble{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:14px 17px;
    box-shadow:var(--shadow);font-size:14.5px;line-height:1.58}
  .bubble.ai .who-label{font-family:var(--serif);font-style:italic;font-size:12.5px;letter-spacing:.2px;color:var(--brass-2);font-weight:500;
    margin-bottom:8px;display:flex;align-items:center;gap:9px}
  .badge{font-size:9px;letter-spacing:.8px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--sub);font-weight:700;text-transform:uppercase}
  .bubble b{color:var(--heading);font-weight:650}
  .bubble i{color:var(--sub)}

  .siren{display:flex;gap:9px;align-items:center;background:var(--warn-bg);border:1px solid var(--warn-ln);
    border-radius:9px;padding:9px 12px;margin:10px 0 4px;font-size:12.8px;color:var(--warn-tx);font-weight:600}
  .siren .ic{width:16px;height:16px;flex:0 0 auto}

  .recs{display:grid;gap:9px;margin-top:12px}
  .rec{border:1px solid var(--line-2);border-left:2px solid var(--brass);border-radius:9px;padding:11px 13px;background:var(--paper)}
  .rec .rt{font-weight:650;font-size:13.5px;color:var(--heading);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .rec .rt .pill{font-size:10px;letter-spacing:.3px;color:var(--muted);font-weight:600;white-space:nowrap}
  .rec .rt .val{color:var(--brass-2);font-weight:700}
  .rec .rb{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
  .rec .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  .rtag{font-size:10px;letter-spacing:.2px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--sub)}
  .signals{margin-top:12px;border-top:1px solid var(--line-2);padding-top:10px}
  .signals .sk{color:var(--brass-2);font-family:var(--serif);font-style:italic;font-weight:500;letter-spacing:.2px;font-size:12px;margin-bottom:7px}
  .signals .chips{display:flex;flex-wrap:wrap;gap:6px}
  .sig{font-size:11px;padding:3px 9px;border-radius:6px;background:rgba(183,110,121,.1);color:var(--brass-2);border:1px solid rgba(183,110,121,.22)}

  /* Composer */
  .composer{border-top:1px solid var(--line);padding:14px 26px 18px;background:var(--paper)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--sub);
    padding:8px 13px;border-radius:9px;cursor:pointer;transition:all .12s;font-family:var(--sans)}
  .chip:hover{border-color:var(--brass);color:var(--heading);background:var(--card)}
  .inbox{display:flex;gap:10px;align-items:flex-end}
  .inbox textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-family:var(--sans);
    font-size:14.5px;line-height:1.4;min-height:50px;max-height:130px;background:var(--field);color:var(--text)}
  .inbox textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(183,110,121,.14)}
  .send{background:var(--ink);color:var(--ivory);border:none;border-radius:12px;padding:0 22px;height:50px;font-size:14px;
    font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:var(--sans)}
  .send:hover{background:var(--ink-2)}
  .ctx{font-size:11.5px;color:var(--muted);margin:10px 4px 0;display:flex;align-items:center;gap:6px}
  .ctx b{color:var(--sub)}

  /* Right panel */
  .bloom{background:linear-gradient(168deg,var(--ink),var(--ink-2));color:var(--ivory);border-radius:16px;padding:16px;margin-bottom:16px;
    display:flex;gap:15px;align-items:center;position:relative;overflow:hidden}
  .bloom .dial{width:58px;height:58px;flex:0 0 auto;position:relative}
  .bloom .dial svg{width:100%;height:100%;overflow:visible;transform:scale(1.15)}
  .bloom .petal{stroke:var(--gold);stroke-width:1.4;fill:var(--brass);fill-opacity:calc(var(--p,0)*.22);stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p,0)*100);transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1),fill-opacity 1.2s ease}
  .bloom .bmeta{flex:1;min-width:0}
  .bloom .bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .bloom .bl{font-family:var(--serif);font-style:italic;font-size:14px;color:rgba(251,244,230,.78);font-weight:500}
  .bloom .bs{font-family:var(--serif);font-size:28px;font-weight:600;color:#fff;line-height:1}
  .bloom .cap{font-size:11px;color:rgba(251,244,230,.56);margin-top:6px;line-height:1.4}

  .profile-hd{display:flex;gap:13px;align-items:center;margin-bottom:6px}
  .profile-hd .avatar{width:48px;height:48px;border-radius:50%;font-size:18px}
  .profile-hd .nm{font-family:var(--serif);font-size:21px;color:var(--heading);font-weight:600;line-height:1.05}
  .profile-hd .pm{font-size:11.5px;color:var(--muted);margin-top:3px}
  .occasion{margin:13px 0 16px;padding:11px 13px;border-radius:11px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,rgba(183,110,121,.15),rgba(183,110,121,.05));border:1px solid rgba(183,110,121,.32)}
  .occasion::after{content:"";position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 18px 18px 0;
    border-color:transparent var(--cream) transparent transparent;filter:drop-shadow(-1px 1px 1px rgba(0,0,0,.05))}
  .occasion .ol{font-family:var(--serif);font-size:12px;font-style:italic;letter-spacing:.2px;color:var(--brass-2);font-weight:500}
  .occasion .ov{font-size:13.5px;color:var(--heading);margin-top:3px;font-weight:600}
  .pblock{margin-bottom:16px}
  .pblock h4{font-family:var(--serif);font-size:14px;letter-spacing:.2px;color:var(--heading);margin:0 0 9px;font-weight:600;
    padding-bottom:5px;border-bottom:1px solid var(--line-2)}
  .krow{display:flex;justify-content:space-between;gap:12px;font-size:12.8px;padding:5px 0;border-bottom:1px solid var(--line-2)}
  .krow:last-child{border-bottom:none}
  .krow .k{color:var(--muted)}
  .krow .val{color:var(--heading);font-weight:550;text-align:right}
  .taglist{display:flex;flex-wrap:wrap;gap:6px}
  .flag{font-size:11.5px;padding:3px 9px;border-radius:7px;font-weight:600}
  .flag.warn{background:var(--warn-bg);color:var(--warn-tx);border:1px solid var(--warn-ln)}
  .flag.love{background:var(--chip);color:var(--sub)}
  .notes{list-style:none;margin:0;padding:0}
  .notes li{font-size:12px;color:var(--muted);line-height:1.45;padding:6px 0;border-bottom:1px dashed var(--line-2)}
  .notes li:last-child{border-bottom:none}
  .notes li .src{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--brass-2);font-weight:700;margin-right:6px}

  .prep{background:var(--ink);color:var(--ivory);border-radius:14px;padding:15px 16px;margin-top:4px}
  .prep h4{color:#f0c0cb;font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.2px;margin:0 0 11px}
  .prep .pitem{display:flex;gap:10px;align-items:flex-start;font-size:12.6px;line-height:1.4;padding:8px 0;border-bottom:1px solid rgba(251,244,230,.09);cursor:pointer}
  .prep .pitem:last-of-type{border-bottom:none}
  .prep .box{width:16px;height:16px;border:1.5px solid var(--brass);border-radius:4px;flex:0 0 auto;margin-top:1px;position:relative;transition:.15s}
  .prep .box::before{content:"";position:absolute;inset:-4px;border-radius:7px;border:1.5px solid var(--brass);opacity:0;pointer-events:none}
  .prep .pitem.done .box::before{animation:bell .6s ease}
  @keyframes bell{0%{opacity:.65;transform:scale(.55)}100%{opacity:0;transform:scale(1.7)}}
  .prep .pitem.done .box{background:var(--brass)}
  .prep .pitem.done .box::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .prep .pitem.done .ptext{opacity:.5;text-decoration:line-through}
  .prep .owner{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:#e6a0b3;font-weight:700;margin-top:3px}
  .actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
  .qa{flex:1;min-width:92px;background:rgba(251,244,230,.08);border:1px solid rgba(183,110,121,.3);color:var(--ivory);
    font-size:11.5px;font-weight:600;padding:8px 6px;border-radius:8px;cursor:pointer;font-family:var(--sans)}
  .qa:hover{background:rgba(183,110,121,.22)}

  /* Walk-in intake */
  .intake .fld{margin-bottom:12px}
  .intake label{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--brass-2);font-weight:700;margin-bottom:6px}
  .intake select,.intake input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;font-family:var(--sans);background:var(--field);color:var(--text)}
  .checks{display:flex;flex-wrap:wrap;gap:7px}
  .check{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;user-select:none;background:var(--field)}
  .check.on{background:var(--ink);color:var(--ivory);border-color:var(--ink)}

  /* walk-in primary button */
  .btn{border:none;border-radius:9px;padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .btn.primary{background:var(--ink);color:var(--ivory);flex:1}

  .typing{display:inline-flex;gap:4px;padding:2px 0}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--brass);animation:bl 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ivory);
    padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:1180px){.main{grid-template-columns:250px 1fr 320px}.metrics{gap:16px}.metric+.metric{padding-left:16px}}
  @media (max-width:980px){.main{grid-template-columns:1fr}.rail{display:none}.metrics{display:none}}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:9px}
  /* ---- presentation polish & bells ---- */
  .present-btn{margin-left:6px;width:132px;justify-content:center;background:var(--brass);color:#160d05;border:1px solid rgba(255,255,255,.16);
    height:38px;border-radius:10px;cursor:pointer;font-size:12.5px;font-weight:700;letter-spacing:.4px;font-family:var(--sans);
    display:flex;align-items:center;gap:7px;box-shadow:0 6px 16px -10px rgba(183,110,121,.9)}
  .present-btn:hover{filter:brightness(1.06)}
  .present-btn.on{background:var(--aubergine);color:#fff;border-color:rgba(255,255,255,.2)}
  .msg{animation:rise .32s cubic-bezier(.22,1,.36,1) both}
  .recs .rec{animation:rise .34s cubic-bezier(.22,1,.36,1) both}
  .recs .rec:nth-child(2){animation-delay:.06s}
  .recs .rec:nth-child(3){animation-delay:.12s}
  .recs .rec:nth-child(4){animation-delay:.18s}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bloom.pulse .bs{animation:pop .42s cubic-bezier(.22,1,.36,1)}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06);color:var(--gold)}100%{transform:scale(1)}}
  .present-banner{position:fixed;top:86px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:35;opacity:0;
    background:var(--ivory);color:var(--ink);border:1px solid rgba(183,110,121,.55);padding:7px 18px;border-radius:999px;
    font-size:12px;font-weight:600;letter-spacing:.4px;transition:.3s;pointer-events:none;box-shadow:var(--shadow)}
  .present-banner .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brass);margin-right:9px;animation:halo 1.8s ease infinite}
  @keyframes halo{0%{box-shadow:0 0 0 0 rgba(183,110,121,.5)}70%{box-shadow:0 0 0 6px rgba(183,110,121,0)}100%{box-shadow:0 0 0 0 rgba(183,110,121,0)}}
  .present-banner.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .impact{margin-top:11px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .impact .ik{color:var(--good-tx);font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-size:9.5px}
  .impact .imp{font-size:11px;padding:3px 9px;border-radius:6px;background:var(--good-bg);color:var(--good-tx);border:1px solid var(--good-ln)}
  button.scn{background:none;border:none;width:100%;text-align:left;font-family:var(--sans);cursor:pointer}
  button.check{font-family:var(--sans);font-size:12px;color:var(--text)}
  .kbd-hint{font-size:10.5px;color:var(--muted);margin-top:12px;padding:0 4px;line-height:1.7}
  .kbd-hint kbd{background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:var(--sans);font-size:10px;color:var(--sub)}
  a:focus-visible,button:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  header.top :focus-visible{outline-color:#e6a0b3}
  /* header icon controls */
  .hbtn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:transparent;border:none;color:var(--ivory);transition:background .15s,transform .35s}
  .hbtn:hover{background:rgba(251,246,239,.1)}
  .hbtn svg{width:18px;height:18px}
  .present-btn svg{width:13px;height:13px}
  .theme-toggle .moon{display:none}
  [data-theme="dark"] .theme-toggle .sun{display:none}
  [data-theme="dark"] .theme-toggle .moon{display:block}
  /* follow-up suggestion chips (agentic UI) */
  .followups{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 6px 42px;max-width:760px;animation:rise .4s ease both}
  .fu{font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--sub);padding:6px 12px;border-radius:999px;
    cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:6px;transition:border-color .12s,color .12s}
  .fu:hover{border-color:var(--brass);color:var(--heading)}
  .fu .ar{color:var(--brass-2);font-weight:700}
  .bubble.ai .reveal{animation:fadein .5s ease both}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

  /* ============ Atelier Tools: modal shell + launcher ============ */
  .modal-scrim{position:fixed;inset:0;background:var(--overlay,rgba(30,20,14,.5));backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
  .modal-scrim.open{opacity:1;pointer-events:auto}
  .tool-modal{position:fixed;top:50%;left:50%;width:min(1040px,94vw);height:min(760px,90vh);transform:translate(-50%,-48%) scale(.98);
    opacity:0;pointer-events:none;background:var(--paper);border:1px solid var(--line);border-radius:18px;z-index:61;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 100px -40px rgba(30,20,14,.7);transition:opacity .28s,transform .28s cubic-bezier(.22,1,.36,1)}
  .tool-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .tool-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2);flex:0 0 auto}
  .tool-title{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--heading)}
  .tool-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--brass);color:var(--color-on-accent,#fff)}
  .tool-ic svg{width:17px;height:17px}
  .tool-close{margin-left:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
  .tool-close:hover{color:var(--heading);border-color:var(--brass)}
  .tool-body{flex:1;overflow-y:auto;padding:22px 24px}
  .tool-guestbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .tool-guestbar .gp{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;background:var(--card);font-size:12.5px;color:var(--sub);transition:.12s}
  .tool-guestbar .gp .av{width:22px;height:22px;border-radius:6px;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .tool-guestbar .gp.on{border-color:var(--brass);color:var(--heading);background:var(--brass-soft,rgba(183,110,121,.1))}

  /* launcher grid */
  .launcher{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .lc{position:relative;text-align:left;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);cursor:pointer;overflow:hidden;transition:transform .14s,border-color .14s,box-shadow .14s}
  .lc:hover{transform:translateY(-2px);border-color:var(--brass);box-shadow:var(--shadow)}
  .lc .lic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--brass-soft,rgba(183,110,121,.12));color:var(--brass-2);margin-bottom:11px}
  .lc .lic svg{width:20px;height:20px}
  .lc h4{margin:0 0 4px;font-size:14.5px;color:var(--heading);font-weight:650}
  .lc p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
  .lc .badge2{position:absolute;top:12px;right:12px;font-size:9px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;color:var(--brass-2)}

  /* section helpers */
  .th{font-family:var(--serif);font-size:13.5px;letter-spacing:.2px;color:var(--heading);font-weight:600;margin:0 0 10px}
  .tsub{font-size:12.5px;color:var(--muted);margin:-4px 0 16px;line-height:1.5}

  /* 1 Stay Storyboard */
  .sb-meter{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .sb-track{flex:1;height:8px;border-radius:8px;background:var(--chip);overflow:hidden}
  .sb-fill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--brass),var(--gold));transition:width .6s cubic-bezier(.22,1,.36,1)}
  .sb-pct{font-family:var(--serif);font-size:20px;color:var(--heading);font-weight:600;min-width:44px;text-align:right}
  .sb-rail{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .sb-col{position:relative}
  .sb-col h5{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--brass-2);font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:7px}
  .sb-col .when{font-size:10.5px;color:var(--muted);margin-bottom:10px}
  .sb-col::before{content:"";position:absolute;top:6px;right:-7px;width:14px;height:1px;background:var(--line)}
  .sb-col:last-child::before{display:none}
  .sb-card{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:var(--card);cursor:grab;font-size:12px;color:var(--text);line-height:1.4;transition:.15s;position:relative}
  .sb-card:active{cursor:grabbing}
  .sb-card.done{border-color:var(--brass);background:var(--brass-soft,rgba(183,110,121,.08))}
  .sb-card .ownr{font-size:9px;letter-spacing:.4px;text-transform:uppercase;color:var(--brass-2);font-weight:700;margin-top:5px}
  .sb-card.drag{opacity:.4}
  .sb-col.over{outline:2px dashed var(--brass);outline-offset:3px;border-radius:10px}
  .sb-dot{width:9px;height:9px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 0 var(--brass);animation:halo 2s infinite}

  /* 2 Handoff card */
  .hc-wrap{max-width:560px;margin:0 auto}
  .hc{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hc.fold .hc-line{animation:foldin .5s both}
  @keyframes foldin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hc h3{font-family:var(--serif);font-size:22px;margin:0 0 2px;color:var(--heading)}
  .hc .hc-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .hc-line{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--text);line-height:1.45}
  .hc-line:last-child{border-bottom:none}
  .hc-line .k{flex:0 0 96px;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--brass-2);font-weight:700;padding-top:2px}
  .hc-actions{display:flex;gap:8px;margin-top:16px;justify-content:center}

  /* 3 Delight dial */
  .dial-wrap{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:center}
  .dial{position:relative;width:210px;height:210px;margin:0 auto;border-radius:50%;cursor:pointer;
    background:conic-gradient(var(--brass) calc(var(--v,1)*25%),var(--chip) 0);transition:background .4s cubic-bezier(.22,1,.36,1)}
  .dial::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--paper);box-shadow:inset 0 2px 8px rgba(30,20,14,.12)}
  .dial-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
  .dial-c .lvl{font-family:var(--serif);font-size:26px;color:var(--heading);font-weight:600}
  .dial-c .cost{font-size:12px;color:var(--brass-2);font-weight:700;margin-top:2px}
  .dial-steps{display:flex;justify-content:center;gap:6px;margin-top:14px}
  .dial-steps button{width:30px;height:6px;border-radius:6px;border:none;background:var(--chip);cursor:pointer}
  .dial-steps button.on{background:var(--brass)}
  .dopt{border:1px solid var(--line);border-left:2px solid var(--brass);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:var(--card);animation:rise .3s both}
  .dopt .dt{font-weight:650;font-size:13.5px;color:var(--heading)}
  .dopt .db{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}

  /* 4 Lobby radar */
  .radar{position:relative;height:300px;border-radius:14px;border:1px solid var(--line);overflow:hidden;
    background:radial-gradient(circle at 50% 120%,var(--brass-soft,rgba(183,110,121,.14)),transparent 60%),var(--card)}
  .radar .ring{position:absolute;border:1px solid var(--line-2);border-radius:50%;left:50%;top:60%;transform:translate(-50%,-50%)}
  .blip{position:absolute;transform:translate(-50%,-50%);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2}
  .blip .pt{width:16px;height:16px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 0 currentColor;animation:halo 2.4s infinite}
  .blip .nm{font-size:10px;color:var(--sub);white-space:nowrap;font-weight:600}
  .radar-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)}
  .radar-legend span{display:inline-flex;align-items:center;gap:6px}
  .radar-legend i{width:9px;height:9px;border-radius:50%}
  .lane-pop{position:absolute;background:var(--ink);color:var(--ivory);border-radius:9px;padding:8px 11px;font-size:11.5px;max-width:190px;line-height:1.4;z-index:5;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:.15s}
  .lane-pop.show{opacity:1}

  /* 5 Risk heatmap */
  .hm{display:grid;gap:8px}
  .hm-row{display:grid;grid-template-columns:130px repeat(4,1fr);gap:8px;align-items:center}
  .hm-h{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}
  .hm-g{font-size:12.5px;color:var(--heading);font-weight:600;display:flex;align-items:center;gap:8px}
  .hm-cell{height:46px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;color:#fff;position:relative;overflow:hidden;transition:transform .12s}
  .hm-cell:hover{transform:scale(1.04)}
  .hm-cell .rip{position:absolute;inset:0;border-radius:9px;animation:ripple 2.6s infinite}
  @keyframes ripple{0%{box-shadow:inset 0 0 0 0 rgba(255,255,255,.4)}70%{box-shadow:inset 0 0 0 30px rgba(255,255,255,0)}100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}}

  /* 6 Room constellation */
  .constel{position:relative;height:340px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
  .constel svg{position:absolute;inset:0;width:100%;height:100%}
  .cn{position:absolute;transform:translate(-50%,-50%);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--sub);z-index:2;transition:.2s;white-space:nowrap}
  .cn.room{background:var(--ink);color:var(--ivory);border:none;cursor:pointer;font-size:12px;padding:7px 13px}
  .cn.room.sel{box-shadow:0 0 0 3px var(--brass)}
  .cn.pref.lit{border-color:var(--brass);color:var(--heading);background:var(--brass-soft,rgba(183,110,121,.12));box-shadow:0 0 14px -2px var(--brass)}
  .cn-line{stroke:var(--line);stroke-width:1.5;opacity:.5;transition:.25s}
  .cn-line.lit{stroke:var(--brass);opacity:1;stroke-width:2.5}
  .room-score{position:absolute;right:14px;top:14px;text-align:right;z-index:3}
  .room-score .rs{font-family:var(--serif);font-size:30px;color:var(--brass-2);font-weight:700;line-height:1}
  .room-score .rl{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}

  /* 7 Mood mixer */
  .mood-wrap{display:grid;grid-template-columns:260px 1fr;gap:26px}
  .mood-sliders label{display:block;font-size:12px;color:var(--sub);margin:0 0 4px;font-weight:600;display:flex;justify-content:space-between}
  .mood-sliders input[type=range]{width:100%;margin:0 0 16px;accent-color:var(--brass)}
  .mood-out{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--card);transition:background .4s}
  .mood-greet{font-family:var(--serif);font-size:18px;color:var(--heading);line-height:1.35;margin-bottom:14px}
  .mood-act{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text);padding:8px 0;border-top:1px solid var(--line-2)}
  .mood-act .mi{color:var(--brass-2)}
  .mood-chip{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;background:var(--brass-soft,rgba(183,110,121,.12));color:var(--brass-2);font-weight:600;margin-bottom:12px}

  /* 8 Recovery playbook */
  .rp-wrap{display:grid;grid-template-columns:210px 1fr;gap:22px}
  .rp-inc{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;background:var(--card);cursor:grab;font-size:12.5px;color:var(--text);transition:.14s}
  .rp-inc:hover{border-color:var(--brass);transform:translateX(2px)}
  .rp-inc .sev{font-size:9px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-top:5px}
  .rp-drop{min-height:280px;border:2px dashed var(--line);border-radius:14px;padding:16px;transition:.15s;display:flex;flex-direction:column}
  .rp-drop.over{border-color:var(--brass);background:var(--brass-soft,rgba(183,110,121,.06))}
  .rp-empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;max-width:240px;line-height:1.5}
  .rp-step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-2);opacity:0;transform:translateY(8px);animation:rise .4s forwards}
  .rp-step .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--brass);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .rp-step .st{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--brass-2);font-weight:700}
  .rp-step .sb2{font-size:13px;color:var(--text);margin-top:2px;line-height:1.45}

  /* 9 Local flavor bento */
  .lf-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .lf-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .lf-seg button{border:none;background:var(--card);color:var(--sub);font-size:12px;padding:7px 12px;cursor:pointer;font-family:var(--sans)}
  .lf-seg button.on{background:var(--brass);color:#fff}
  .bento{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:120px;gap:12px}
  .bento .bt{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);overflow:hidden;position:relative;animation:rise .4s both}
  .bento .bt.big{grid-column:span 2;grid-row:span 2}
  .bento .bt .cat{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--brass-2);font-weight:700}
  .bento .bt .nm{font-family:var(--serif);font-size:16px;color:var(--heading);margin-top:4px;line-height:1.2}
  .bento .bt.big .nm{font-size:22px}
  .bento .bt .mt{font-size:11px;color:var(--muted);margin-top:6px}
  .bento .bt .wx{position:absolute;bottom:12px;right:12px;font-size:22px;opacity:.5}

  /* 10 Load balancer kanban */
  .kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kb-col{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:11px;min-height:260px;transition:.15s}
  .kb-col.over{border-color:var(--brass);background:var(--brass-soft,rgba(183,110,121,.06))}
  .kb-col h5{margin:0 0 4px;font-size:12px;color:var(--heading);font-weight:650;display:flex;align-items:center;gap:8px}
  .kb-ring{--p:0;width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--brass) calc(var(--p)*1%),var(--chip) 0);position:relative}
  .kb-ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--card)}
  .kb-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--heading);z-index:2}
  .kb-cap{font-size:10px;color:var(--muted);margin-bottom:9px}
  .kb-task{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:7px;background:var(--paper);font-size:11.5px;color:var(--text);cursor:grab;line-height:1.35;transition:.12s}
  .kb-task:hover{border-color:var(--brass)}
  .kb-task .who2{font-size:9px;color:var(--brass-2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
  .kb-task.drag{opacity:.4}

  @media (max-width:720px){.dial-wrap,.mood-wrap,.rp-wrap{grid-template-columns:1fr}.sb-rail,.kb{grid-template-columns:1fr 1fr}.bento{grid-template-columns:1fr 1fr}}
</style>

<script>
/* ============================ DATA ============================ */

    ],

const CATALOG = [
  // New York
  {city:"New York",cat:"dining",name:"Vespera",tags:["italian","seafood","pescatarian","romantic","wine"],blurb:"Candlelit coastal-Italian a block away; celebrated crudo and hand-rolled pastas.",meta:"4 min walk · $$$"},

  // Chicago
  {city:"Chicago",cat:"dining",name:"Senza",tags:["italian","gluten-free","steak"],blurb:"Dedicated gluten-free Italian kitchen &mdash; zero cross-contact.",meta:"5 min walk · $$$"},
  {city:"Chicago",cat:"dining",name:"The Ridge Chophouse",tags:["steak","gluten-free","business"],blurb:"Classic steakhouse with a marked GF menu; good for hosting clients.",meta:"8 min walk · $$$$"},
  {city:"Chicago",cat:"dining",name:"Juniper Counter (on-property)",tags:["coffee","gluten-free","onprop","business"],blurb:"Lobby pour-over bar with labeled GF pastries for early departures.",meta:"On-property · $"},
  {city:"Chicago",cat:"attraction",name:"Lakefront sunrise 5K",tags:["fitness","running","walkable"],blurb:"Pre-mapped loop from the door; towel service on return.",meta:"At the door"},
  {city:"Chicago",cat:"attraction",name:"Arena game night",tags:["sports","nightlife"],blurb:"Lower-level seats plus a car held for the post-game return.",meta:"15 min ride"},
  {city:"Chicago",cat:"fitness",name:"Lotus Fitness · 24h",tags:["fitness","business","onprop"],blurb:"Round-the-clock gym; reserve a bike for 6am.",meta:"On-property"},
  // San Francisco
  {city:"San Francisco",cat:"dining",name:"Trattoria Bambini",tags:["italian","nut-free","family","kids","vegetarian","early-dining"],blurb:"Family trattoria with a certified nut-free kitchen and a kids' pasta bar.",meta:"6 min walk · $$"},
  {city:"San Francisco",cat:"dining",name:"Family Table (on-property)",tags:["family","kids","nut-free","vegetarian","onprop","early-dining"],blurb:"5:30 family seating; allergy-aware chef check-in at the table.",meta:"On-property · $$"},
  {city:"San Francisco",cat:"attraction",name:"Bay Aquarium early entry",tags:["aquarium","kids","family","walkable"],blurb:"Before-crowds admission; stroller-friendly route.",meta:"10 min walk"},
  {city:"San Francisco",cat:"attraction",name:"Waterfront carousel stroll",tags:["family","kids","walkable","easy"],blurb:"Flat, easy loop with a carousel stop &mdash; back before nap time.",meta:"Steps away"},
  {city:"San Francisco",cat:"attraction",name:"Rooftop family pool hour",tags:["pool","kids","family","onprop"],blurb:"Reserved 3&ndash;4pm slot with floats and a lifeguard on deck.",meta:"On-property"}
];

const METRICS = [
  {v:"4.7",a:"&#9650;",l:"Guest Sat"},
  {v:"+18%",a:"",l:"Direct Bookings"},
  {v:"&minus;34%",a:"",l:"Desk Inquiries"},
  {v:"8s",a:"",l:"Avg Answer"}
];

/* ============================ ENGINE ============================ */
const $ = s => document.querySelector(s);
let activeGuest = GUESTS[0];
let personalized = false;

function guestFromText(q){
  const t=" "+q.toLowerCase().replace(/[^a-z\s]/g," ").replace(/\s+/g," ")+" ";
  for(const g of GUESTS){ if(g.matchKeys.some(k=>t.includes(" "+k+" "))) return g; }
  return null;
}
function primaryIntent(q){
  const t=q.toLowerCase(); const has=(...w)=>w.some(x=>t.includes(x));
  if(has("risk","flag","allerg","dietary","celiac","nut allerg")) return "risk";
  if(has("welcome","amenit","special touch","surprise","upgrade","suite","occasion","anniversary","celebrat","gift","honeymoon","touch")) return "touches";
  if(has("prep","before arrival","before check","before he","before she","before they","checks in","check-in","check in","arriv","anticipate","get ready","brief")) return "prep";
  if(has("din","eat","food","restaurant","dinner","lunch","breakfast","gluten","cuisine","italian","menu","coffee","vegetarian")) return "dining";
  if(has("activit","attraction","things to do","explore","tour","spa","gym","fitness","run","pool","aquarium","nightlife","jazz","sport","family","afternoon","plan","itinerary","kid","walk")) return "activity";
  if(has("room","prefer","temperature","bed","pillow","floor","view","climate")) return "room";
  return "overview";
}
function scoreItem(item,g,intentTags){
  let s=0; const gt=new Set(g.prefTags||[]);
  for(const tag of item.tags){ if(gt.has(tag)) s+=2; if(intentTags.has(tag)) s+=1; }
  return s;
}
function dietaryOk(item,g){
  const r=(g.dietary.restrictions.join(" ")).toLowerCase();
  if(item.cat!=="dining") return true;
  if(r.includes("celiac")||r.includes("gluten")){ if(!item.tags.includes("gluten-free")) return false; }
  if(r.includes("nut")){ if(!item.tags.includes("nut-free")) return false; }
  return true;
}
function pick(g,cats,intentTags,n){
  return CATALOG.filter(i=>i.city===g.property.city && cats.includes(i.cat) && dietaryOk(i,g))
    .map(i=>({i,s:scoreItem(i,g,intentTags)})).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.i);
}
function recCard(i,val){
  const tags=i.tags.filter(t=>t!=="onprop").slice(0,4).map(t=>`<span class="rtag">${t.replace(/-/g," ")}</span>`).join("");
  const v=val?`<span class="val">${val}</span>`:`<span class="pill">${i.meta}</span>`;
  return `<div class="rec"><div class="rt"><span>${i.name}</span>${v}</div><div class="rb">${i.blurb}</div><div class="tags">${tags}</div></div>`;
}
function signalsBlock(list){
  return `<div class="signals"><div class="sk">Signals used</div><div class="chips">${list.map(s=>`<span class="sig">${s}</span>`).join("")}</div></div>`;
}
function stripTags(s){ return s.replace(/<[^>]+>/g,"").replace(/&mdash;/g,"").replace(/&amp;/g,"&"); }

const PREP = {
  base:g=>[
    {t:`Set room to <b>${g.room.temp}</b> · ${stripTags(g.room.bed).toLowerCase()}`, o:"Housekeeping"},
    {t:`Flag kitchen: <b>${stripTags(g.dietary.restrictions.join(", "))}</b>`, o:"Kitchen"},
  ],
  anniversary:[{t:"Stage anniversary amenity: chilled prosecco, rose-petal turndown, handwritten card", o:"Concierge"},{t:"Confirm late checkout with housekeeping", o:"Front Desk"}],
  business:[{t:"Confirm 11am early check-in &amp; desk setup; pre-load express checkout", o:"Front Desk"},{t:"Assign a low-floor room with verified Wi-Fi", o:"Front Desk"}],
  family:[{t:"Guarantee connecting rooms; crib, rollaway, childproofing, milk in fridge", o:"Housekeeping"},{t:"Source a stroller and hold at the desk", o:"Concierge"}]
};
function prepList(g){
  const items=[...PREP.base(g), ...(PREP[g.occasionKey]||[])];
  items.push({t:`Greet by name &mdash; ${cap(g.tier)} member, ${g.visits} stays`, o:"Front Desk"});
  return items;
}
function cap(s){ return s? s[0].toUpperCase()+s.slice(1) : s; }

function buildAnswer(query){
  const named=guestFromText(query); const g=named||activeGuest;
  const intent=primaryIntent(query);
  const it=new Set();
  if(intent==="dining"||intent==="risk") ["italian","gluten-free","nut-free","vegetarian","seafood","steak","coffee"].forEach(x=>it.add(x));
  if(intent==="activity") ["spa","fitness","running","aquarium","pool","art","jazz","sports","walkable","kids","family"].forEach(x=>it.add(x));
  let head="",body="",cards="",siren="",sig=g.signals||[];

  if(g.id==="walkin" && !g.built){
    return {guest:g, html:`I don't have a dossier for this walk-in yet. Capture a few preferences in the panel on the right, and I'll personalize on the spot.`};
  }

  if(intent==="risk"){
    const strict=g.dietary.strict;
    head=`Dietary guardrails for <b>${g.name}</b>:`;
    body=`<div class="taglist" style="margin:10px 0 2px">${g.dietary.restrictions.map(r=>`<span class="flag warn">${r}</span>`).join("")}</div>`;
    if(strict) siren=`<div class="siren"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Allergy guardrail active &mdash; dining filtered to ${g.dietary.restrictions.some(r=>/nut/i.test(r))?"nut-free":"gluten-free"} kitchens only.</div>`;
    const picks=pick(g,["dining"],it,2);
    cards=picks.length?`<div class="recs">${picks.map(i=>recCard(i)).join("")}</div>`:"";
    return finalize(g,siren+head+body+cards+impactRow(["Allergy incident avoided","Guest safety"]),sig);
  }
  if(intent==="room"){
    head=`<b>${g.name}</b> &mdash; room preferences:`;
    body=`<div class="recs">
      <div class="rec"><div class="rt"><span>Placement &amp; climate</span></div><div class="rb">${g.room.floor} · ${g.room.temp}</div></div>
      <div class="rec"><div class="rt"><span>Bedding</span></div><div class="rb">${g.room.bed}</div></div>
      <div class="rec"><div class="rt"><span>Standing extras</span></div><div class="rb">${g.room.extras.join(" · ")}</div></div></div>`;
    return finalize(g,head+body,sig);
  }
  if(intent==="dining"){
    const picks=pick(g,["dining"],it,3);
    const guard=g.dietary.strict? (g.dietary.restrictions.some(r=>/nut/i.test(r))?"nut-free kitchens only":"gluten-free kitchens only"):"preference-matched";
    if(g.dietary.strict) siren=`<div class="siren"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Guardrail: ${guard} in ${g.property.city}.</div>`;
    head=`Dining for <b>${g.name}</b> &mdash; ${stripTags(g.dietary.restrictions.join(", "))}, loves ${g.dietary.loves.slice(0,2).join(" / ")}:`;
    cards=`<div class="recs">${picks.map(i=>recCard(i)).join("")}</div>`;
    return finalize(g,siren+head+cards+impactRow(g.dietary.strict?["Allergy incident avoided","Guest trust"]:["Preference match","Upsell-ready"]),sig);
  }
  if(intent==="activity"){
    const picks=pick(g,["attraction","spa","fitness"],it,3);
    head=`Curated for <b>${g.name}</b> around ${g.interests.slice(0,3).join(", ")}:`;
    cards=`<div class="recs">${picks.map(i=>recCard(i)).join("")}</div>`;
    return finalize(g,head+cards,sig);
  }
  if(intent==="touches"){
    const map={
      anniversary:[["Suite upgrade on arrival (Lotus tier)","+$140"],["Champagne &amp; rose-petal turndown","+$60"],["Couples spa ritual &amp; late checkout","+$220"],["Reserved rooftop dinner two-top",""]],
      business:[["Quiet low-floor with verified Wi-Fi + desk",""],["Guaranteed 11am check-in + express checkout",""],["Complimentary pressing, two shirts",""],["Pour-over voucher for early mornings","+$0"]],
      family:[["Connecting rooms + kids' welcome kit",""],["Nut-free snack basket &amp; milk in fridge",""],["Early family dinner + reserved pool hour","+$45"],["Stroller sourced &amp; held at desk",""]],
      leisure:[["Room upgrade on arrival","+$90"],["Welcome amenity to taste",""],["Local experiences curated by concierge",""]]
    }[g.occasionKey]||[["Welcome amenity to taste",""]];
    head=`Special touches to delight <b>${g.name}</b>:`;
    cards=`<div class="recs">${map.map(t=>recCard({name:t[0],blurb:"",tags:[],meta:""},t[1])).join("")}</div>`;
    const rev=map.reduce((a,t)=>a+(parseInt(String(t[1]).replace(/[^0-9]/g,""))||0),0);
    return finalize(g,head+cards+impactRow([`Est. +$${rev} revenue`,"Loyalty lift"]),sig);
  }
  if(intent==="prep"){
    head=`Pre-arrival brief for <b>${g.name}</b> &mdash; ${g.property.name}:`;
    body=`<div class="recs">${prepList(g).map(p=>`<div class="rec"><div class="rt"><span>${p.t}</span><span class="pill">${p.o}</span></div></div>`).join("")}</div>`;
    return finalize(g,head+body+impactRow(["~12 min staff time saved","Fewer desk inquiries"]),sig);
  }
  head=`Snapshot of <b>${g.name}</b> &mdash; ${g.property.name}, ${g.property.city}:`;
  body=`<div class="rb" style="font-size:13.8px;color:var(--text);margin-top:2px">${cap(g.tier)} member · ${g.visits} stays · <i>${g.occasion}</i>. Prefers ${g.room.temp}, ${g.room.floor.toLowerCase()}. ${stripTags(g.dietary.restrictions.join(", "))}; enjoys ${g.interests.slice(0,3).join(", ")}. Ask about dining, activities, room prefs, special touches, risk flags, or pre-arrival prep.</div>`;
  return finalize(g,head+body,sig);
}
function finalize(g,html,sig){ return {guest:g, html: html + signalsBlock(sig)}; }
function impactRow(list){ return `<div class="impact"><span class="ik">Impact</span>${list.map(s=>`<span class="imp">${s}</span>`).join("")}</div>`; }

/* ============================ LLM (optional) ============================ */
/* ============================ RENDER ============================ */
function avatar(g){ return `<div class="avatar" style="background:${g.color}">${g.initials}</div>`; }
function escapeHTML(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function addUser(text){
  const el=document.createElement("div"); el.className="msg user";
  el.innerHTML=`<div class="bubble">${escapeHTML(text)}</div><div class="who">You</div>`;
  $("#stream").appendChild(el); scroll();
}
function addTyping(){
  const el=document.createElement("div"); el.className="msg ai"; el.id="typing";
  el.innerHTML=`<div class="who" style="background:var(--brass)">AI</div><div class="bubble ai"><span class="typing"><span></span><span></span><span></span></span></div>`;
  $("#stream").appendChild(el); scroll();
}
function addAI(html,followupList){
  const t=$("#typing"); if(t) t.remove();
  const el=document.createElement("div"); el.className="msg ai";
  el.innerHTML=`<div class="who" style="background:var(--brass)">AI</div><div class="bubble ai"><div class="who-label">Lotus Atelier <span class="badge">House Notes</span></div><div class="reveal">${html}</div></div>`;
  $("#stream").appendChild(el);
  if(followupList && followupList.length) addFollowups(followupList);
  scroll();
}
function addFollowups(list){
  const row=document.createElement("div"); row.className="followups";
  row.innerHTML=list.map(q=>`<button type="button" class="fu" data-q="${escapeHTML(q)}"><span class="ar" aria-hidden="true">&rarr;</span>${escapeHTML(q)}</button>`).join("");
  $("#stream").appendChild(row);
  row.querySelectorAll(".fu").forEach(b=>b.onclick=()=>ask(b.dataset.q));
}
function followups(g,intent){
  const first=stripTags(g.name).split(" ")[0]; const nm=first==="The"?"the Okafors":first;
  const map={
    room:[`Dining for ${nm}`,`Special touches for ${nm}`,`Pre-arrival prep`],
    dining:[`Things to do near ${nm}`,`Room preferences`,`Dietary risk flags`],
    activity:[`Dining options`,`Special touches for ${nm}`,`Pre-arrival prep`],
    touches:[`Dining for ${nm}`,`Pre-arrival prep`,`Room preferences`],
    prep:[`Dining for ${nm}`,`Special touches for ${nm}`,`Dietary risk flags`],
    risk:[`Safe dining options`,`Pre-arrival prep`,`Room preferences`],
    overview:[`Room preferences`,`Dining options`,`Pre-arrival prep`]
  };
  return map[intent]||map.overview;
}
function scroll(){ const s=$("#stream"); s.scrollTop=s.scrollHeight; }

function personalizeIntro(){
  personalized=true;
  $("#stream").innerHTML="";
  const g=activeGuest;
  animateBloom(23,g.score);
  const first0=stripTags(g.name).split(" ")[0]==="The"?"the Okafors":stripTags(g.name).split(" ")[0];
  setTimeout(()=>toast(`${first0}: 23% \u2192 ${g.score}% personalized`),750);
  addTyping();
  setTimeout(()=>{
    const first=stripTags(g.name).split(" ")[0]==="The"?"the Okafor family":stripTags(g.name).split(" ")[0];
    const html=`Welcome back &mdash; here's ${first} at a glance, and one thing to get ahead of:
      <div class="recs" style="margin-top:11px">
        <div class="rec"><div class="rt"><span>${g.occasion}</span><span class="pill">${cap(g.tier)} · ${g.visits} stays</span></div>
          <div class="rb">Prefers ${g.room.temp}, ${g.room.floor.toLowerCase()}. ${stripTags(g.dietary.restrictions.join(", "))}.</div></div>
        <div class="rec" style="border-left-color:var(--aubergine)"><div class="rt"><span>Get ahead of it</span></div>
          <div class="rb">${g.notes[g.notes.length-1].t}</div></div>
      </div>${signalsBlock(g.signals)}`;
    addAI(html, followups(g,"overview"));
  },650);
}

async function ask(query){
  query=(query||"").trim(); if(!query) return;
  if(!personalized){ personalized=true; }
  const cur=$(".curtain"); if(cur) $("#stream").innerHTML="";
  addUser(query); addTyping();
  const named=guestFromText(query); if(named && named.id!==activeGuest.id) setActive(named);
  await sleep(360);
  const a=buildAnswer(query);
  addAI(a.html, followups(a.guest, primaryIntent(query)));
}

function animateBloom(from,to){
  const num=$("#bloomScore"); if(!num) return;
  const dial=$("#bloomDial"), wrap=num.closest(".bloom");
  if(dial){ dial.style.setProperty("--p",(from/100).toFixed(3)); requestAnimationFrame(()=>setTimeout(()=>dial.style.setProperty("--p",(to/100).toFixed(3)),60)); }
  num.textContent=from;
  requestAnimationFrame(()=>{ setTimeout(()=>{
    let cur=from; const step=()=>{ if(!num.isConnected) return; cur+=Math.ceil((to-cur)/6); if(cur>=to){ cur=to; if(wrap){ wrap.classList.remove("pulse"); void wrap.offsetWidth; wrap.classList.add("pulse"); } } num.textContent=cur; if(cur<to) setTimeout(step,60); }; step();
  },60); });
}

function buildWalkin(){
  const g=activeGuest;
  const city=$("#wkCity").value, occ=$("#wkOcc").value;
  const diet=[...document.querySelectorAll("#wkDiet .check.on")].map(c=>c.dataset.v);
  const strict=diet.some(d=>/celiac|nut/i.test(d));
  const tagsByOcc={leisure:["walkable"],anniversary:["romantic","wine"],business:["business","fitness"],family:["family","kids"]};
  g.property={name:{ "New York":"Lotus SoHo","Chicago":"Lotus Loop","San Francisco":"Lotus Embarcadero"}[city], city};
  g.occasionKey=occ; g.occasion={leisure:"Leisure stay",anniversary:"Anniversary / romantic getaway",business:"Business trip",family:"Family visit"}[occ];
  g.dietary={restrictions:diet.length?diet:["No restrictions noted"],loves:[],avoid:[],strict};
  g.prefTags=[...(tagsByOcc[occ]||[]),...diet.map(d=>/celiac/i.test(d)?"gluten-free":/nut/i.test(d)?"nut-free":d.toLowerCase())];
  g.interests={leisure:["Local dining","Easy walks"],anniversary:["Fine dining","Spa"],business:["Fitness","Efficient service"],family:["Family attractions","Pool"]}[occ];
  g.room={floor:"Preference not yet on file",temp:"Standard",bed:"To confirm at desk",extras:["Newly captured profile"]};
  g.notes=[{src:"Walk-in · just now",t:"Profile captured at the desk &mdash; enrich after stay to lift the score."}];
  g.signals=["walk-in intake",occ,...diet.slice(0,2)];
  g.score=diet.length?68:52; g.built=true;
  renderChips(); renderCtx(); renderProfile(); animateBloom(23,g.score);
  $("#stream").innerHTML=""; personalized=true; addTyping();
  setTimeout(()=>addAI(buildAnswer("overview").html, followups(activeGuest,"overview")),500);
  toast("Walk-in personalized");
}
function setActive(g){

  if(g.id!=="walkin"||g.built){ animateBloom(Math.max(23,g.score-30),g.score); }
  document.querySelectorAll(".gcard").forEach(b=>b.classList.remove("active"));
  const rb=document.querySelector(`.gcard[data-id="${g.id}"]`); if(rb) rb.classList.add("active");
}

/* ---------- presentation / demo mode ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const PRESENT_SCRIPT=[
  {id:"sarah",q:"What are Sarah's room preferences?"},
  {id:"sarah",q:"What welcome touch for Sarah's anniversary?"},
  {id:"marcus",q:"Recommend gluten-free Italian dining for Marcus."},
  {id:"okafor",q:"Plan a family-friendly afternoon for the Okafors."},
  {id:"marcus",q:"Anything to prep before Marcus checks in?"}
];
let presenting=false, presentRunId=0, paused=false, skip=false;
function banner(t){ const b=$("#presentBanner"); if(!t){ b.classList.remove("show"); b.innerHTML=""; return; } b.innerHTML=`<span class="d"></span>${t}`; b.classList.add("show"); }
function waitScene(ms,run){
  return new Promise(res=>{ let el=0; const iv=setInterval(()=>{
    if(run!==presentRunId){ clearInterval(iv); res(); return; }
    if(paused) return;
    if(skip){ skip=false; clearInterval(iv); res(); return; }
    el+=50; if(el>=ms){ clearInterval(iv); res(); }
  },50); });
}
async function typewrite(el,text,run){ el.value=""; for(const ch of text){ if(run!==presentRunId) return; while(paused){ await sleep(80); if(run!==presentRunId) return; } el.value+=ch; el.dispatchEvent(new Event("input")); await sleep(26); } }
function setPresentBtn(on){ const pb=$("#presentBtn"); pb.classList.toggle("on",on); const lbl=$("#presentLabel"); if(lbl) lbl.textContent=on?"End demo":"Begin demo"; const ic=pb.querySelector("svg"); if(ic) ic.innerHTML=on?'<rect x="6" y="6" width="12" height="12" rx="1.5"/>':'<path d="M8 5v14l11-7z"/>'; pb.setAttribute("aria-label",on?"Stop guided demo":"Run guided demo"); }
async function startPresent(){
  presentRunId++; const run=presentRunId; presenting=true; paused=false; skip=false;
  setPresentBtn(true); $("#input").blur(); $("#stream").innerHTML=""; personalized=true;
  setActive(GUESTS[0]);
  banner("Guided run &middot; setting the scene");
  animateBloom(23,GUESTS[0].score); toast("Sarah: 23% \u2192 96% personalized");
  await waitScene(2400,run); if(run!==presentRunId) return;
  for(let i=0;i<PRESENT_SCRIPT.length;i++){
    if(run!==presentRunId) return;
    const s=PRESENT_SCRIPT[i];
    setActive(GUESTS.find(g=>g.id===s.id));
    banner(`Guided run &middot; Scene ${i+1} of ${PRESENT_SCRIPT.length}`);
    await waitScene(700,run); if(run!==presentRunId) return;
    await typewrite($("#input"), s.q, run); if(run!==presentRunId) return;
    await waitScene(260,run); if(run!==presentRunId) return;
    await go();
    await waitScene(3000,run); if(run!==presentRunId) return;
  }
  banner("Guided run &middot; complete"); endPresent(true);
}
function endPresent(done){
  presenting=false; paused=false; presentRunId++;
  setPresentBtn(false);
  const t=$("#typing"); if(t) t.remove();
  $("#input").value=""; $("#input").style.height="auto";
  if(done){ setTimeout(()=>{ if(!presenting) banner(""); },2800); } else banner("");
}
function togglePresent(){ if(presenting) endPresent(false); else startPresent(); }
$("#presentBtn").onclick=togglePresent;
document.addEventListener("keydown",e=>{
  if(presenting){
    if(e.key==="Escape"){ e.preventDefault(); endPresent(false); return; }
    if(e.key===" "){ e.preventDefault(); paused=!paused; banner(paused?"Guided run &middot; paused":"Guided run &middot; resumed"); return; }
    if(e.key==="ArrowRight"){ e.preventDefault(); skip=true; return; }
    if(e.key.toLowerCase()==="r"){ e.preventDefault(); startPresent(); return; }
    return;
  }
  if(e.key==="Escape"){ return; }
  const tag=(document.activeElement&&document.activeElement.tagName)||"";
  if(["INPUT","TEXTAREA","SELECT"].includes(tag)) return;
  if(e.key.toLowerCase()==="t"){ openLauncher(); return; }
  if(e.key>="1"&&e.key<="5"){ const q=SCENARIOS[+e.key-1]; if(q) ask(q.replace(/&rsquo;/g,"'")); }
  else if(e.key.toLowerCase()==="p"){ togglePresent(); }
  else if(e.key.toLowerCase()==="w"){ $("#walkinBtn").click(); }
});

function showModal(o){ $("#toolScrim").classList.toggle("open",o); $("#toolModal").classList.toggle("open",o); toolOpen=o; if(!o){ $("#toolsBtn").focus(); } }
function openLauncher(){
  $("#toolIcon").innerHTML=wrapIcon(IC.heatmap); $("#toolName").textContent="Atelier Tools";
  $("#toolBody").innerHTML=`<p class="tsub">Ten interactive tools that turn guest data into action. Press <b>T</b> anytime to reopen this.</p>

  $("#toolBody").querySelectorAll(".lc").forEach(b=>b.onclick=()=>openTool(b.dataset.t));

function openTool(id){

    :`<div class="tool-guestbar"><button data-back style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px">&larr; Tools</button></div>`;

  body.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ toolGuest=GUESTS.find(x=>x.id===b.dataset.g); openTool(id); });
  const bk=body.querySelector("[data-back]"); if(bk) bk.onclick=openLauncher;

/* ---- drag helper ---- */
function dnd(root,cardSel,zoneSel,onDrop){
  root.querySelectorAll(cardSel).forEach(c=>{ c.setAttribute("draggable","true");
    c.addEventListener("dragstart",()=>{ dragEl=c; setTimeout(()=>c.classList.add("drag"),0); });
    c.addEventListener("dragend",()=>{ c.classList.remove("drag"); dragEl=null; });
  });
  root.querySelectorAll(zoneSel).forEach(z=>{
    z.addEventListener("dragover",e=>{ e.preventDefault(); z.classList.add("over"); });
    z.addEventListener("dragleave",()=>z.classList.remove("over"));
    z.addEventListener("drop",e=>{ e.preventDefault(); z.classList.remove("over"); if(dragEl&&onDrop) onDrop(dragEl,z); });
  });
}

/* ===== 5. Risk Heatmap ===== */
function renderHeatmap(g,root){
  const gs=toolGuests(); const cats=["Allergy","Dietary","Timing","Service"];
  const sevc=["#e8e0d8","#8fae7e","#d6a53f","#c96b4f","#b04030"];
  const score=(gg,c)=>{ if(c==="Allergy") return gg.dietary.restrictions.some(r=>/nut|allerg/i.test(r))?4:(gg.dietary.strict?3:0);
    if(c==="Dietary") return Math.min(4,gg.dietary.restrictions.filter(r=>!/no restr/i.test(r)).length*2);
    if(c==="Timing") return /early|late|11am|connecting/i.test(JSON.stringify(gg.room)+gg.occasion)?2:1;
    return Math.min(4,(gg.notes||[]).filter(n=>/follow-up/i.test(n.src)).length*3); };
  const lbl=v=>["None","Low","Watch","High","Critical"][v]||"Low";
  root.innerHTML=`<p class="tsub">Where could ${gs.length} arrivals go wrong today? Brighter means higher risk — click a tile for the detail.</p>
    <div class="hm"><div class="hm-row"><div></div>${cats.map(c=>`<div class="hm-h">${c}</div>`).join("")}</div>
    ${gs.map(gg=>`<div class="hm-row"><div class="hm-g"><span class="av" style="width:22px;height:22px;border-radius:6px;background:${gg.color};color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700">${gg.initials}</span>${firstName(gg)}</div>
      ${cats.map(c=>{ const v=score(gg,c); return `<div class="hm-cell" style="background:${sevc[v]};${v<=1?'color:#5e4b40':''}" data-d="${escapeHTML(firstName(gg)+" · "+c+": "+lbl(v))}">${lbl(v)}${v>=3?'<span class="rip"></span>':''}</div>`; }).join("")}</div>`).join("")}</div>`;
  root.querySelectorAll(".hm-cell").forEach(c=>c.onclick=()=>toast(c.dataset.d));
}

/* ===== 6. Room Match Constellation ===== */
function roomPrefs(g){ const p=[]; const f=g.room.floor.toLowerCase(), t=stripTags(g.room.temp).toLowerCase(), b=g.room.bed.toLowerCase();
  if(/high/.test(f))p.push("High floor"); if(/low/.test(f))p.push("Low floor"); if(/quiet|away/.test(f))p.push("Quiet");
  if(/view|skyline/.test(f))p.push("View"); if(/cool/.test(t))p.push("Cool"); if(/warm/.test(t))p.push("Warm");
  if(/king/.test(b))p.push("King bed"); if(/quee|crib|rollaway/.test(b))p.push("Family beds");
  if(g.occasionKey==="family")p.push("Connecting"); if(g.occasionKey==="business")p.push("Work desk"); if(g.occasionKey==="anniversary")p.push("Romantic");
  return p.slice(0,6); }
function renderConstel(g,root){
  const prefs=roomPrefs(g);
  const rooms=[{name:"Room 1408",traits:["High floor","View","Quiet","King bed","Cool","Romantic"]},
    {name:"Room 512",traits:["Low floor","Quiet","Work desk","King bed","Warm"]},
    {name:"Suite 1601",traits:["High floor","View","Connecting","Family beds","Warm","Quiet","Romantic"]}];
  root.innerHTML=`<p class="tsub">Why does a room fit ${firstName(g)}? Pick a room and its matching preferences light up along the constellation.</p>
    <div class="constel" id="constel"><svg id="cnSvg"></svg><div class="room-score" id="rScore"></div>
      ${prefs.map((p,i)=>`<div class="cn pref" data-pref="${p}" style="left:22%;top:${14+i*(72/Math.max(1,prefs.length-1))}%">${p}</div>`).join("")}
      ${rooms.map((r,i)=>`<div class="cn room" data-room="${i}" style="left:75%;top:${26+i*24}%">${r.name}</div>`).join("")}</div>`;
  const svg=$("#cnSvg"), box=$("#constel");
  const draw=(sel)=>{ if(!$("#rScore")||!box.isConnected) return; const W=box.clientWidth,H=box.clientHeight; svg.innerHTML="";
    const rm=box.querySelector(`.cn.room[data-room="${sel}"]`); const rx=rm.offsetLeft+rm.offsetWidth/2, ry=rm.offsetTop+rm.offsetHeight/2;
    let hit=0; prefs.forEach(p=>{ const pel=box.querySelector(`.cn.pref[data-pref="${p}"]`); const px=pel.offsetLeft+pel.offsetWidth/2,py=pel.offsetTop+pel.offsetHeight/2;
      const on=rooms[sel].traits.includes(p); if(on)hit++;
      svg.insertAdjacentHTML("beforeend",`<line class="cn-line ${on?'lit':''}" x1="${px}" y1="${py}" x2="${rx}" y2="${ry}"/>`);
      pel.classList.toggle("lit",on); });
    box.querySelectorAll(".cn.room").forEach(r=>r.classList.toggle("sel",+r.dataset.room===sel));
    $("#rScore").innerHTML=`<div class="rs">${hit}/${prefs.length}</div><div class="rl">prefs matched</div>`; };
  box.querySelectorAll(".cn.room").forEach(r=>r.onclick=()=>draw(+r.dataset.room));
  setTimeout(()=>draw(0),80);
}

    room:[["Acknowledge",`Apologise to ${nm} in person; own it without excuses.`],["Fix",`Fast-track the room now; store bags and offer the lounge meanwhile.`],["Delight",`Comp a drink and send a small amenity to the room.`],["Log",`Note the delay + recovery on the profile for the next stay.`]],
    noise:[["Acknowledge",`Thank ${nm} for flagging it; apologise for the disturbance.`],["Fix",`Address the source or offer a quiet-side room move tonight.`],["Delight",`Late checkout + breakfast on us for the trouble.`],["Log",`Flag the room-noise pairing so we don't repeat it.`]],
    meal:[["Acknowledge",`Stop service immediately; check on ${nm}'s wellbeing first. ${g.dietary.strict?"⚠ "+stripTags(g.dietary.restrictions.join(", ")):""}`],["Fix",`Involve the chef; remake on a clean line and confirm allergens by hand.`],["Delight",`Comp the meal and send a sincere note from the kitchen.`],["Log",`Incident report + kitchen review; hard-flag the allergy everywhere.`]],
    bill:[["Acknowledge",`Hear ${nm} out fully before responding; assume good faith.`],["Fix",`Walk the folio line by line; correct any error on the spot.`],["Delight",`Waive a fair disputed charge to protect the relationship.`],["Log",`Record the resolution so checkout is smooth next time.`]] }; return M[id]; };
  root.innerHTML=`<p class="tsub">Things go wrong. Drop an incident onto ${firstName(g)} and get a calm, tailored recovery plan — acknowledge → fix → delight → log.</p>
    <div class="rp-wrap"><div><div class="th">Incidents</div>${INC.map(i=>`<div class="rp-inc" data-i="${i.id}">${i.t}<div class="sev" style="color:${i.c}">${i.sev}</div></div>`).join("")}</div>
      <div class="rp-drop" id="rpDrop"><div class="rp-empty" id="rpEmpty">Drag an incident here (or click one) to generate ${firstName(g)}'s recovery ladder.</div></div></div>`;
  const run=(id)=>{ const steps=ladder(id); $("#rpDrop").innerHTML=steps.map((s,i)=>`<div class="rp-step" style="animation-delay:${i*.12}s"><div class="num">${i+1}</div><div><div class="st">${s[0]}</div><div class="sb2">${s[1]}</div></div></div>`).join(""); };
  root.querySelectorAll(".rp-inc").forEach(c=>c.onclick=()=>run(c.dataset.i));
  dnd(root,".rp-inc","#rpDrop",(el)=>run(el.dataset.i));
}

/* ===== 9. Local Flavor Composer ===== */
function renderFlavor(g,root){
  const WX=[["☀️","Clear, 72°"],["⛅","Mild, 66°"],["🌧️","Light rain, 58°"]]; let wx=0, span="half";
  const build=()=>{
    const cats = span==="short"?["dining"]:span==="eve"?["dining","attraction"]:["attraction","dining","spa","fitness"];
    let items=[]; cats.forEach(c=>{ const p=pick(g,[c==="attraction"?"attraction":c],new Set(),2); items=items.concat(p); });
    items=items.filter((v,i,a)=>a.findIndex(x=>x.name===v.name)===i);
    if(wx===2) items=items.filter(i=>!/walk|stroll|run|pool|trail/i.test(i.name+i.blurb)).concat(items); // rain: prefer indoor first
    items=items.slice(0, span==="short"?3:span==="eve"?4:6);
    $("#bento").innerHTML=items.map((i,idx)=>`<div class="bt${idx===0?' big':''}" style="animation-delay:${idx*.05}s"><div class="cat">${i.cat}</div><div class="nm">${i.name}</div><div class="mt">${i.meta}</div>${idx===0?`<div class="wx">${WX[wx][0]}</div>`:""}</div>`).join("");
  };
  root.innerHTML=`<p class="tsub">Compose a plan for ${firstName(g)} from what they love, the time they have, and today's conditions.</p>
    <div class="lf-top"><div class="lf-seg" id="lfSpan"><button data-s="short">2 hours</button><button data-s="half" class="on">Half day</button><button data-s="eve">Evening</button></div>
      <button class="btn" id="lfWx" style="background:var(--card);border:1px solid var(--line);color:var(--sub)">${WX[0][0]} ${WX[0][1]}</button>
      <button class="btn primary" id="lfSurprise" style="margin-left:auto">✨ Surprise me</button></div>
    <div class="bento" id="bento"></div>`;
  root.querySelectorAll("#lfSpan button").forEach(b=>b.onclick=()=>{ span=b.dataset.s; root.querySelectorAll("#lfSpan button").forEach(x=>x.classList.toggle("on",x===b)); build(); });
  $("#lfWx").onclick=()=>{ wx=(wx+1)%WX.length; $("#lfWx").innerHTML=WX[wx][0]+" "+WX[wx][1]; build(); };
  $("#lfSurprise").onclick=()=>{ const el=$("#bento"); el.style.animation="none"; void el.offsetWidth; CATALOG.sort(()=>Math.random()-.5); build(); el.querySelectorAll(".bt").forEach(b=>{ b.style.animation="rise .5s both"; }); toast("Reshuffled ✨"); };
  build();
}

/* ===== 10. Service Load Balancer ===== */
function renderLoad(g,root){
  const cols=["Front Desk","Housekeeping","Kitchen","Concierge"]; const cap=5;
  const tasks=[]; toolGuests().forEach(gg=>prepList(gg).forEach(p=>tasks.push({t:stripTags(p.t),o:p.o,g:firstName(gg)})));
  root.innerHTML=`<p class="tsub">Personalization shouldn't overload one team. Drag tasks between columns to balance the load — the rings update live.</p>
    <div class="kb" id="kb">${cols.map(c=>`<div class="kb-col" data-col="${c}"><h5><span class="kb-ring" data-ring="${c}"><b></b></span>${c}</h5><div class="kb-cap" data-cap="${c}"></div>
      <div class="kb-tasks" data-zone>${tasks.filter(t=>t.o===c).map(t=>`<div class="kb-task">${t.t}<div class="who2">${t.g}</div></div>`).join("")}</div></div>`).join("")}</div>`;
  const upd=()=>{ cols.forEach(c=>{ const n=root.querySelector(`[data-col="${c}"] .kb-tasks`).children.length; const pct=Math.min(100,Math.round(n/cap*100));
    const ring=root.querySelector(`[data-ring="${c}"]`); ring.style.setProperty("--p",pct); ring.querySelector("b").textContent=n;
    ring.style.filter=n>cap?"none":""; const cap2=root.querySelector(`[data-cap="${c}"]`); cap2.textContent=n>cap?`Overloaded · ${n}/${cap}`:`${n}/${cap} tasks`; cap2.style.color=n>cap?"#b04030":"var(--muted)"; }); };
  dnd(root,".kb-task",".kb-col",(el,z)=>{ z.querySelector("[data-zone]").appendChild(el); const c=z.dataset.col; el.querySelector(".who2")&&(el.querySelector(".who2").textContent=el.querySelector(".who2").textContent); upd(); });
  upd();
}

/* ---------- init ---------- */
renderMetrics(); renderRoster(); renderScenarios(); renderChips(); renderCtx(); renderProfile(); renderCurtain();
</script>
